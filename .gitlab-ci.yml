stages:
  - build
  - test

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  CMAKE_BUILD_TYPE: Release

default:
  tags:
    - windows

build_vst3:
  stage: build
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE
    - cmake --build build --config $CMAKE_BUILD_TYPE --target PolyPitchShifter_VST3
  artifacts:
    name: "PolyPitchShifter-VST3-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/PolyPitchShifter_artefacts/Release/VST3/
    expire_in: 1 week
